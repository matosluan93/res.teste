version: "3.9"

# ─── TalentOS · Ambiente de Desenvolvimento ───────────

services:

  postgres:
    image: postgres:16-alpine
    container_name: talentos_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-talentos_os}
      POSTGRES_USER: ${POSTGRES_USER:-talentos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-talentos_secret_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-talentos} -d ${POSTGRES_DB:-talentos_os}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - talentos_net

  redis:
    image: redis:7-alpine
    container_name: talentos_cache
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_secret_dev}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret_dev}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - talentos_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: talentos_api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-talentos}:${POSTGRES_PASSWORD:-talentos_secret_dev}@postgres:5432/${POSTGRES_DB:-talentos_os}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret_dev}@redis:6379/0
    volumes:
      - ./backend:/app
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - talentos_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: talentos_web
    restart: unless-stopped
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    ports:
      - "3000:80"
    networks:
      - talentos_net

  nginx:
    image: nginx:1.25-alpine
    container_name: talentos_proxy
    restart: unless-stopped
    volumes:
      - ./infrastructure/nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend
    networks:
      - talentos_net

volumes:
  postgres_data:
  redis_data:
  backend_uploads:
  backend_logs:

networks:
  talentos_net:
    driver: bridge
